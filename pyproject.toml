[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ps1-optical-kit"
version = "1.0.0"
description = "Software-only synthetic optical backend compatibility probes"
requires-python = ">=3.10"

[project.scripts]
ps1-optical-kit = "ps1kit.runner:main"

[tool.setuptools.packages.find]
include = ["ps1kit*"]
